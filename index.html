<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniGames">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <title>MiniGames</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1b2a;
      --surface: #152030;
      --border: #1e3045;
      --accent: #4db8ff;
      --text: #e2eaf4;
      --muted: #5a7a9a;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    header {
      padding: 24px 20px 16px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 20px rgba(77, 184, 255, 0.35);
    }

    header p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    main {
      flex: 1;
      padding: 8px 16px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-content: start;
      justify-content: center;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(150px, 45vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 12px 16px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: radial-gradient(circle at 50% 0%, rgba(77,184,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .game-card:active {
      transform: scale(0.96);
      box-shadow: 0 0 24px rgba(77, 184, 255, 0.15);
      border-color: var(--accent);
    }

    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 24px rgba(77, 184, 255, 0.12);
        border-color: rgba(77, 184, 255, 0.4);
      }
    }

    .game-icon {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .game-icon svg {
      width: 100%;
      height: 100%;
    }

    .game-name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.3;
      color: var(--text);
    }

    /* Install banner */
    #install-banner {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 0 16px 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #1a2f45, #152030);
      border: 1px solid rgba(77, 184, 255, 0.3);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text);
      animation: fadeIn 0.3s ease;
    }

    #install-banner.visible { display: flex; }

    #install-banner span { flex: 1; line-height: 1.4; }

    #install-btn {
      flex-shrink: 0;
      background: var(--accent);
      color: #0d1b2a;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #install-btn:active { opacity: 0.8; }

    #dismiss-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<header>
  <h1>MiniGames</h1>
  <p>Choose a game</p>
</header>

<div id="install-banner">
  <span>Add MiniGames to your home screen for quick access</span>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn" aria-label="Dismiss">×</button>
</div>

<main>

  <!-- Flow Logic -->
  <a class="game-card" href="flow-logic/flow-logic.html">
    <div class="game-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <rect width="80" height="80" fill="#0f1724"/>
        <!-- Grid lines -->
        <line x1="20" y1="0" x2="20" y2="80" stroke="#1a2e42" stroke-width="1"/>
        <line x1="40" y1="0" x2="40" y2="80" stroke="#1a2e42" stroke-width="1"/>
        <line x1="60" y1="0" x2="60" y2="80" stroke="#1a2e42" stroke-width="1"/>
        <line x1="0" y1="20" x2="80" y2="20" stroke="#1a2e42" stroke-width="1"/>
        <line x1="0" y1="40" x2="80" y2="40" stroke="#1a2e42" stroke-width="1"/>
        <line x1="0" y1="60" x2="80" y2="60" stroke="#1a2e42" stroke-width="1"/>
        <!-- Red path: (10,10)→(30,10)→(30,30) -->
        <polyline points="10,10 30,10 30,30" fill="none" stroke="#ff4d4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="10" r="7" fill="#ff4d4d"/>
        <circle cx="30" cy="30" r="7" fill="#ff4d4d"/>
        <!-- Green path: (50,10)→(50,50)→(70,50) -->
        <polyline points="50,10 50,50 70,50" fill="none" stroke="#4dff91" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="10" r="7" fill="#4dff91"/>
        <circle cx="70" cy="50" r="7" fill="#4dff91"/>
        <!-- Blue path: (10,50)→(10,70)→(70,70) -->
        <polyline points="10,50 10,70 70,70" fill="none" stroke="#4db8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="50" r="7" fill="#4db8ff"/>
        <circle cx="70" cy="70" r="7" fill="#4db8ff"/>
        <!-- Yellow dot pair -->
        <circle cx="70" cy="10" r="7" fill="#ffe04d"/>
        <circle cx="30" cy="70" r="7" fill="#ffe04d"/>
      </svg>
    </div>
    <span class="game-name">Neon Flow</span>
  </a>

  <!-- Gemstone Mania -->
  <a class="game-card" href="gemstone-mania/gemstone-mania.html">
    <div class="game-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <rect width="80" height="80" fill="#1a1a2e"/>
        <!-- Purple gem -->
        <polygon points="40,6 58,20 58,42 40,56 22,42 22,20" fill="#a855f7"/>
        <polygon points="40,6 58,20 40,24 22,20" fill="#c084fc"/>
        <polygon points="40,24 58,20 58,42 40,56" fill="#7c3aed"/>
        <polygon points="40,24 22,20 22,42 40,56" fill="#9333ea"/>
        <line x1="40" y1="6" x2="40" y2="24" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="22" y1="20" x2="58" y2="20" stroke="white" stroke-width="1" opacity="0.4"/>
        <!-- Small blue gem bottom-left -->
        <polygon points="16,60 24,66 24,74 16,78 8,74 8,66" fill="#3b82f6"/>
        <polygon points="16,60 24,66 16,68 8,66" fill="#60a5fa"/>
        <!-- Small red gem bottom-right -->
        <polygon points="64,60 72,66 72,74 64,78 56,74 56,66" fill="#ef4444"/>
        <polygon points="64,60 72,66 64,68 56,66" fill="#f87171"/>
        <!-- Small green gem top-right -->
        <polygon points="68,8 74,12 74,18 68,22 62,18 62,12" fill="#22c55e"/>
        <polygon points="68,8 74,12 68,14 62,12" fill="#4ade80"/>
      </svg>
    </div>
    <span class="game-name">Gemstone Mania</span>
  </a>

</main>

<footer>tap a game to play</footer>

<script>
  // PWA install prompt
  let deferredPrompt = null;
  const banner = document.getElementById('install-banner');
  const installBtn = document.getElementById('install-btn');
  const dismissBtn = document.getElementById('dismiss-btn');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add('visible');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove('visible');
  });

  dismissBtn.addEventListener('click', () => {
    banner.classList.remove('visible');
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    banner.classList.remove('visible');
  });

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>

</body>
</html>
